<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight — Мониторинг баз данных</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f1117;
            color: #e6e6e6;
            min-height: 100vh;
        }
        .container { max-width: 1280px; margin: 0 auto; padding: 24px 20px 40px; }

        header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #262a35; }
        header h1 { font-size: 26px; letter-spacing: 1px; }
        header h1 .moon { color: #7aa2ff; }
        header .subtitle { color: #8b93a7; font-size: 14px; margin-top: 4px; }

        .top-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .status-bar { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #8b93a7; }
        .status-bar { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #8b93a7; }
        .ws-status { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 20px; background: #1a1e29; border: 1px solid #262a35; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #f44336; }
        .dot.on { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .last-update { font-variant-numeric: tabular-nums; }

        .btn {
            background: #7aa2ff; color: #0f1117; border: none; border-radius: 8px;
            padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background .15s;
        }
        .btn:hover { background: #93b4ff; }
        .btn.secondary { background: #262a35; color: #e6e6e6; }
        .btn.secondary:hover { background: #333a49; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-top: 24px; position: relative; }

        .card {
            background: #161a24;
            border: 1px solid #262a35;
            border-radius: 12px;
            padding: 18px;
            position: relative;
            transition: border-color .2s, transform .15s;
        }
        .card:hover { transform: translateY(-2px); }
        .card.refreshing { border-color: #7aa2ff; }
        .card.absolute { position: absolute; margin: 0; z-index: 5; }
        .card.absolute:hover, .card.dragging, .card.resizing { transform: none; }
        .card.dragging { cursor: move; opacity: .9; z-index: 50; }
        .card.resizing { user-select: none; }
        .card.blocked { border-color: #ff6b6b; box-shadow: 0 0 0 1px #ff6b6b; }
        .card.collapsed .card-body { display: none; }
        .card.collapsed .icon,
        .card.collapsed .db-desc,
        .card.collapsed .card-actions { display: none; }
        .card.collapsed .card-head { cursor: pointer; }
        .card-body { overflow-y: auto; }

        .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; cursor: move; }
        .card-head:active { cursor: grabbing; }
        .card-head .icon { font-size: 20px; }
        .card-title { flex: 1; overflow: hidden; min-width: 0; }
        .card-title h2 { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .db-desc { color: #8b93a7; font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .collapse-btn {
            background: none; border: 1px solid #333a49; color: #8b93a7; cursor: pointer;
            font-size: 11px; padding: 3px 8px; border-radius: 6px; line-height: 1.4;
        }
        .collapse-btn:hover { color: #7aa2ff; border-color: #7aa2ff; }

        .resize-handle {
            position: absolute; right: 0; bottom: 0; width: 16px; height: 16px;
            cursor: nwse-resize; opacity: 0; transition: opacity .15s;
        }
        .card:hover .resize-handle { opacity: .6; }
        .resize-handle::after {
            content: ''; position: absolute; right: 3px; bottom: 3px;
            width: 6px; height: 6px;
            border-right: 2px solid #7aa2ff; border-bottom: 2px solid #7aa2ff;
        }
        .card-head .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff9800; flex-shrink: 0; }
        .card-head .status-dot.ok { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .card-head .status-dot.err { background: #f44336; box-shadow: 0 0 8px #f44336; }
        .card-head .status-dot.unknown { background: #ff9800; box-shadow: 0 0 8px #ff9800; }

        .del-btn {
            background: none; border: none; color: #5a6172; cursor: pointer;
            font-size: 15px; padding: 4px 6px; border-radius: 6px; line-height: 1;
        }
        .del-btn:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }

        .card-sub { color: #8b93a7; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

        .metrics { display: flex; flex-direction: column; gap: 8px; }
        .metric { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; padding-bottom: 8px; border-bottom: 1px dashed #232836; }
        .metric:last-child { border-bottom: none; padding-bottom: 0; }
        .metric .label { color: #8b93a7; }
        .metric .value { font-family: 'Consolas', 'Menlo', monospace; color: #e6e6e6; font-weight: 600; text-align: right; overflow-wrap: anywhere; }

        .error-msg { color: #ff6b6b; font-size: 12px; margin-top: 10px; word-break: break-word; }

        .empty-state { grid-column: 1 / -1; text-align: center; color: #5a6172; padding: 60px 0; }
        .empty-state button { margin-top: 16px; }

        footer { margin-top: 32px; text-align: center; color: #5a6172; font-size: 12px; }
        footer a { color: #7aa2ff; text-decoration: none; }

        /* Модалка */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.6);
            display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }
        .overlay.open { display: flex; }
        .modal {
            background: #161a24; border: 1px solid #262a35; border-radius: 12px;
            padding: 24px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
        }
        .modal h3 { margin-bottom: 18px; font-size: 18px; }
        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; color: #8b93a7; font-size: 13px; margin-bottom: 6px; }
        .form-row input, .form-row select {
            width: 100%; padding: 9px 12px; border-radius: 8px;
            border: 1px solid #333a49; background: #0f1117; color: #e6e6e6; font-size: 14px;
        }
        .form-row input:focus, .form-row select:focus { outline: none; border-color: #7aa2ff; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .form-error { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

        .card-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .details-btn {
            background: none; border: 1px solid #333a49; color: #8b93a7; cursor: pointer;
            font-size: 12px; padding: 3px 9px; border-radius: 6px; line-height: 1.4;
        }
        .details-btn:hover { color: #7aa2ff; border-color: #7aa2ff; }

        .modal-lg { max-width: 980px; }
        .details-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .details-head h3 { margin-bottom: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .close-btn {
            background: none; border: none; color: #8b93a7; cursor: pointer;
            font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 6px;
        }
        .close-btn:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }

        .details-body { display: flex; flex-direction: column; gap: 22px; }
        .details-section h4 {
            color: #8b93a7; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #262a35;
        }
        .details-section.error h4 { color: #ff6b6b; }
        .details-error { color: #ff6b6b; font-size: 13px; }

        .kv-table { width: 100%; border-collapse: collapse; }
        .kv-table td { padding: 6px 10px; font-size: 13px; border-bottom: 1px dashed #232836; vertical-align: top; }
        .kv-table td:first-child { color: #8b93a7; width: 38%; white-space: nowrap; }
        .kv-table td:last-child { font-family: 'Consolas', 'Menlo', monospace; word-break: break-all; }

        .table-wrap { overflow-x: auto; max-height: 340px; overflow-y: auto; border: 1px solid #262a35; border-radius: 8px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-table th, .data-table td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #232836; white-space: nowrap; }
        .data-table th { position: sticky; top: 0; background: #1a1e29; color: #8b93a7; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
        .data-table td { font-family: 'Consolas', 'Menlo', monospace; }

        .card.wide { grid-column: 1 / -1; }

        .pg-metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .pg-chip { background: #1a1e29; border: 1px solid #262a35; border-radius: 8px; padding: 7px 12px; min-width: 92px; }
        .pg-chip b { display: block; font-size: 15px; font-family: 'Consolas', 'Menlo', monospace; }
        .pg-chip span { color: #8b93a7; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }

        .card-tables { display: flex; flex-direction: column; gap: 16px; }
        .card-table h4 { color: #8b93a7; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .card-table .table-wrap { max-height: 220px; }
        .card-table .data-table th, .card-table .data-table td { padding: 4px 8px; font-size: 11px; white-space: normal; word-break: break-word; }
        .card-empty { color: #5a6172; font-size: 12px; padding: 6px 0; }

        .details-loading { color: #8b93a7; text-align: center; padding: 40px 0; font-size: 14px; }
        .details-loading .spinner {
            display: inline-block; width: 22px; height: 22px; border: 3px solid #333a49;
            border-top-color: #7aa2ff; border-radius: 50%; animation: spin .8s linear infinite;
            vertical-align: middle; margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1><span class="moon">🌙</span> MIDNIGHT</h1>
                <div class="subtitle">Мониторинг баз данных</div>
            </div>
            <div class="top-actions">
                <span class="ws-status"><span class="dot" id="wsDot"></span><span id="wsText">Подключение...</span></span>
                <span class="last-update">Обновлено: <span id="lastUpdate">—</span></span>
                <button class="btn" id="addBtn">+ Добавить БД</button>
            </div>
        </header>

        <main class="grid" id="grid">
            <div class="empty-state" id="empty">
                Пока нет подключений
                <br><button class="btn" onclick="openModal()">+ Добавить подключение</button>
            </div>
        </main>

        <footer>
            Midnight API &bull; <a href="/docs" target="_blank">Swagger UI</a> &bull; <a href="/redoc" target="_blank">ReDoc</a>
        </footer>
    </div>

    <!-- Модалка добавления подключения -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h3>Новое подключение</h3>
            <form id="connForm" onsubmit="return false;">
                <div class="form-row">
                    <label for="fName">Название</label>
                    <input id="fName" required placeholder="Например: Prod PostgreSQL #2">
                </div>
                <div class="form-row">
                    <label for="fDesc">Описание</label>
                    <input id="fDesc" placeholder="Например: основная БД продакшена">
                </div>
                <div class="form-row">
                    <label for="fType">Тип БД</label>
                    <select id="fType">
                        <option value="postgres">PostgreSQL</option>
                        <option value="redis">Redis</option>
                        <option value="memcache">Memcached</option>
                        <option value="mongo">MongoDB</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="fHost">Хост</label>
                    <input id="fHost" value="localhost">
                </div>
                <div class="form-grid">
                    <div class="form-row">
                        <label for="fPort">Порт</label>
                        <input id="fPort" type="number" value="5432">
                    </div>
                    <div class="form-row" id="fUserRow">
                        <label for="fUser">Пользователь</label>
                        <input id="fUser" placeholder="postgres">
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-row" id="fPassRow">
                        <label for="fPass">Пароль</label>
                        <input id="fPass" type="password">
                    </div>
                    <div class="form-row" id="fDbRow">
                        <label for="fDb">База данных</label>
                        <input id="fDb">
                    </div>
                </div>
                <div class="form-error" id="formError"></div>
                <div class="modal-actions">
                    <button type="button" class="btn secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn" id="submitBtn">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модалка деталей подключения -->
    <div class="overlay" id="detailsOverlay">
        <div class="modal modal-lg">
            <div class="details-head">
                <h3 id="detailsTitle">Детали</h3>
                <button class="close-btn" id="detailsClose" title="Закрыть">✕</button>
            </div>
            <div class="details-body" id="detailsBody">
                <div class="details-loading"><span class="spinner"></span>Загрузка...</div>
            </div>
        </div>
    </div>

    <script>
        const TYPE_META = {
            postgres:  { label: 'PostgreSQL', icon: '🐘', port: 5432, user: true,  pass: true,  db: true,  dbLabel: 'База данных', dbPlaceholder: 'postgres', dbValue: 'postgres' },
            redis:     { label: 'Redis',      icon: '🔴', port: 6379, user: false, pass: true,  db: true,  dbLabel: 'БД (номер)',  dbPlaceholder: '0',        dbValue: '0' },
            memcache:  { label: 'Memcached',  icon: '🧠', port: 11211, user: false, pass: false, db: false },
            mongo:     { label: 'MongoDB',    icon: '🍃', port: 27017, user: true,  pass: true,  db: true,  dbLabel: 'База данных', dbPlaceholder: 'admin',   dbValue: 'admin' },
        };

        const METRICS = {
            redis: [
                { key: 'version', label: 'Версия' },
                { key: 'connected_clients', label: 'Клиенты' },
                { key: 'used_memory_human', label: 'Память' },
                { key: 'db_size', label: 'Ключей' },
                { key: 'uptime_seconds', label: 'Аптайм', format: fmtUptime },
                { key: 'latency_ms', label: 'Отклик', format: v => v + ' мс' },
            ],
            memcached: [
                { key: 'uptime', label: 'Аптайм', format: fmtUptime },
                { key: 'curr_items', label: 'Элементов' },
                { key: 'curr_connections', label: 'Соединения' },
                { key: 'get_hits', label: 'Хиты' },
                { key: 'get_misses', label: 'Промахи' },
                { key: 'latency_ms', label: 'Отклик', format: v => v + ' мс' },
            ],
            mongo: [
                { key: 'version', label: 'Версия' },
                { key: 'connections', label: 'Соединения' },
                { key: 'uptime_seconds', label: 'Аптайм', format: fmtUptime },
                { key: 'latency_ms', label: 'Отклик', format: v => v + ' мс' },
            ],
        };

        const PG_CHIPS = [
            { key: 'version', label: 'Версия' },
            { key: 'client_connections', label: 'Подключения' },
            { key: 'active_queries', label: 'Активных запросов' },
            { key: 'latency_ms', label: 'Отклик', format: v => v + ' мс' },
        ];

        const POSTGRES_TABLES = [
            { key: 'active_requests', title: 'Активные запросы' },
            { key: 'index_usage', title: 'Частота использования индексов' },
            { key: 'top_tables', title: 'Самые используемые таблицы' },
            { key: 'table_tree', title: 'Дерево таблиц' },
        ];

        const COLUMN_LABELS = {
            pid: 'PID',
            leader_pid: 'Лидер (PID)',
            datid: 'База (OID)',
            datname: 'База данных',
            usesysid: 'Пользователь (OID)',
            usename: 'Пользователь',
            application_name: 'Приложение',
            client_addr: 'Адрес клиента',
            client_hostname: 'Хост клиента',
            client_port: 'Порт клиента',
            backend_start: 'Старт бэкенда',
            xact_start: 'Старт транзакции',
            query_start: 'Старт запроса',
            state_change: 'Смена состояния',
            wait_event_type: 'Тип ожидания',
            wait_event: 'Событие ожидания',
            state: 'Состояние',
            backend_xid: 'XID',
            backend_xmin: 'XMIN',
            query_id: 'ID запроса',
            query: 'Запрос',
            backend_type: 'Тип бэкенда',
            duration_s: 'Длительность, с',
            duration: 'Длительность',
            schemaname: 'Схема',
            relname: 'Таблица',
            table_name: 'Таблица',
            tablename: 'Таблица',
            index_name: 'Индекс',
            indexname: 'Индекс',
            indexdef: 'Определение индекса',
            idx_scan: 'Сканирований по индексу',
            idx_tup_read: 'Прочитано строк',
            idx_tup_fetch: 'Выбрано из таблицы',
            seq_scan: 'Последовательное сканирование',
            n_tup_ins: 'Вставки',
            n_tup_upd: 'Обновления',
            n_tup_del: 'Удаления',
            n_live_tup: 'Живых строк',
            column_count: 'Количество колонок',
            total_size_bytes: 'Размер',
            columns: 'Колонки',
            usesuper: 'Суперпользователь',
            usecreatedb: 'Может создавать БД',
            valuntil: 'Действует до',
            viewname: 'Представление',
            viewowner: 'Владелец',
            definition: 'Определение',
            matviewname: 'Материализованное представление',
            matviewowner: 'Владелец',
            tablespace: 'Табличное пространство',
            hasindexes: 'Есть индексы',
            ispopulated: 'Заполнено',
            name: 'Имя',
            default_version: 'Версия по умолчанию',
            installed_version: 'Установленная версия',
            comment: 'Комментарий',
            value: 'Значение',
        };

        function colLabel(c) {
            const ru = COLUMN_LABELS[c];
            return ru ? `${c} (${ru})` : c;
        }

        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');
        const wsDot = document.getElementById('wsDot');
        const wsText = document.getElementById('wsText');
        const lastUpdate = document.getElementById('lastUpdate');
        const cards = {};
        const deletedIds = new Set();

        /* ---------- Карточки ---------- */

        function ensureCard(id, type, name) {
            if (cards[id]) return cards[id];
            const meta = TYPE_META[type] || { label: type, icon: '🗄️' };
            const isPg = type === 'postgres';
            const metrics = METRICS[type] || [];
            const card = { el: null, values: {}, dot: null, error: null, isPg };
            const el = document.createElement('section');
            el.className = 'card' + (isPg ? ' wide' : '');
            el.innerHTML = `
                <div class="card-head">
                    <span class="status-dot unknown"></span>
                    <span class="icon">${meta.icon}</span>
                    <div class="card-title">
                        <h2 class="db-name"></h2>
                        <div class="db-desc"></div>
                    </div>
                    <div class="card-actions">
                        <button class="collapse-btn" title="Свернуть/развернуть">▾</button>
                        <button class="details-btn" title="Детальная статистика">Детали</button>
                        <button class="del-btn" title="Удалить подключение">✕</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-sub">${meta.label}</div>
                    ${isPg ? `
                        <div class="pg-metrics"></div>
                        <div class="card-tables"></div>
                    ` : `
                        <div class="metrics">
                            ${metrics.map(m => `<div class="metric"><span class="label">${m.label}</span><span class="value" data-key="${m.key}">—</span></div>`).join('')}
                        </div>
                    `}
                    <div class="error-msg" data-role="error" style="display:none;"></div>
                </div>
                <div class="resize-handle" title="Изменить размер"></div>
            `;
            card.el = el;
            card.nameEl = el.querySelector('.db-name');
            card.descEl = el.querySelector('.db-desc');
            card.dot = el.querySelector('.status-dot');
            card.error = el.querySelector('[data-role="error"]');
            card.values = {};
            metrics.forEach(m => card.values[m.key] = el.querySelector(`[data-key="${m.key}"]`));
            if (isPg) {
                card.chips = {};
                PG_CHIPS.forEach(ch => {
                    const chip = document.createElement('div');
                    chip.className = 'pg-chip';
                    chip.innerHTML = `<b></b><span>${ch.label}</span>`;
                    el.querySelector('.pg-metrics').appendChild(chip);
                    card.chips[ch.key] = chip.querySelector('b');
                });
                card.tableEls = {};
                POSTGRES_TABLES.forEach(sec => {
                    const section = document.createElement('div');
                    section.className = 'card-table';
                    section.innerHTML = `<h4>${sec.title}</h4><div class="card-empty">—</div>`;
                    el.querySelector('.card-tables').appendChild(section);
                    card.tableEls[sec.key] = section.querySelector('div');
                });
            }
            el.querySelector('.details-btn').addEventListener('click', () => openDetails(id));
            el.querySelector('.del-btn').addEventListener('click', () => deleteConnection(id));
            el.querySelector('.collapse-btn').addEventListener('click', () => toggleCollapse(card));
            el.querySelector('.card-head').addEventListener('pointerdown', (e) => startDrag(card, e));
            el.querySelector('.resize-handle').addEventListener('pointerdown', (e) => startResize(card, e));
            grid.appendChild(el);
            cards[id] = card;
            updateEmptyState();
            return card;
        }

        function render(stats) {
            Object.keys(stats).forEach(id => {
                if (deletedIds.has(id)) return;
                const info = stats[id];
                const type = info.type || 'unknown';
                const card = ensureCard(id, type, info.name || id);
                card.nameEl.textContent = info.name || id;
                card.descEl.textContent = info.description || '';

                const state = info.status === 'connected' ? 'ok' : info.status === 'error' ? 'err' : 'unknown';
                card.dot.className = 'status-dot ' + state;

                if (info.status === 'error' && info.message) {
                    card.error.textContent = info.message;
                    card.error.style.display = '';
                } else {
                    card.error.textContent = '';
                    card.error.style.display = 'none';
                }

                const metrics = info.metrics || {};
                if (card.isPg) {
                    renderPostgresCard(card, info);
                } else {
                    (METRICS[type] || []).forEach(m => {
                        const raw = metrics[m.key];
                        card.values[m.key].textContent = raw == null ? '—' : (m.format ? m.format(raw) : String(raw));
                    });
                }

                card.el.classList.add('refreshing');
                clearTimeout(card.el._t);
                card.el._t = setTimeout(() => card.el.classList.remove('refreshing'), 250);
            });

            Object.keys(cards).forEach(id => {
                if (!(id in stats)) { cards[id].el.remove(); delete cards[id]; }
            });

            updateEmptyState();
            lastUpdate.textContent = new Date().toLocaleTimeString('ru-RU');
        }

        function updateEmptyState() {
            empty.style.display = Object.keys(cards).length ? 'none' : '';
        }

        /* ---------- Перетаскивание, ресайз, сворачивание ---------- */

        function toggleCollapse(card) {
            const collapsed = card.el.classList.toggle('collapsed');
            if (collapsed) {
                card.el.style.height = 'auto';
            } else {
                card.el.style.height = '';
            }
        }

        function toAbsolute(card) {
            const el = card.el;
            if (!el.classList.contains('absolute')) {
                el.style.width = el.offsetWidth + 'px';
                el.style.height = el.offsetHeight + 'px';
                el.classList.add('absolute');
            }
        }

        function rectsOverlap(a, b) {
            return a.left < b.right && a.right > b.left
                && a.top < b.bottom && a.bottom > b.top;
        }

        function collisionCard(card) {
            const rect = card.el.getBoundingClientRect();
            for (const id in cards) {
                const other = cards[id];
                if (other === card || !other.el || !other.el.isConnected) continue;
                const o = other.el.getBoundingClientRect();
                if (rectsOverlap(rect, o)) return other;
            }
            return null;
        }

        let dragState = null;

        function startDrag(card, e) {
            if (e.button !== 0 || e.target.closest('button')) return;
            const el = card.el;
            toAbsolute(card);
            dragState = {
                mode: 'move', card,
                prev: { left: el.offsetLeft, top: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight },
                startX: e.clientX, startY: e.clientY,
            };
            el.classList.add('dragging');
            e.preventDefault();
        }

        function startResize(card, e) {
            if (e.button !== 0) return;
            const el = card.el;
            toAbsolute(card);
            dragState = {
                mode: 'resize', card,
                prev: { left: el.offsetLeft, top: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight },
                startX: e.clientX, startY: e.clientY,
            };
            el.classList.add('resizing');
            e.preventDefault();
        }

        window.addEventListener('pointermove', (e) => {
            if (!dragState) return;
            const s = dragState;
            const dx = e.clientX - s.startX;
            const dy = e.clientY - s.startY;
            s.moved = Math.max(Math.abs(dx), Math.abs(dy));
            const el = s.card.el;
            if (s.mode === 'move') {
                el.style.left = (s.prev.left + dx) + 'px';
                el.style.top = (s.prev.top + dy) + 'px';
                el.classList.toggle('blocked', !!collisionCard(s.card));
            } else {
                el.style.width = Math.max(280, s.prev.w + dx) + 'px';
                el.style.height = Math.max(120, s.prev.h + dy) + 'px';
                el.classList.toggle('blocked', !!collisionCard(s.card));
            }
        });

        window.addEventListener('pointerup', () => {
            const s = dragState;
            if (!s) return;
            const el = s.card.el;
            el.classList.remove('blocked');
            if (s.mode === 'move' && (s.moved || 0) < 6 && el.classList.contains('collapsed')) {
                toggleCollapse(s.card);
            } else if (collisionCard(s.card)) {
                el.style.left = s.prev.left + 'px';
                el.style.top = s.prev.top + 'px';
                el.style.width = s.prev.w + 'px';
                el.style.height = s.prev.h + 'px';
            }
            el.classList.remove('dragging', 'resizing');
            dragState = null;
        });

        function renderPostgresCard(card, info) {
            const metrics = info.metrics || {};
            PG_CHIPS.forEach(ch => {
                const raw = metrics[ch.key];
                card.chips[ch.key].textContent = raw == null ? '—' : (ch.format ? ch.format(raw) : String(raw));
            });
            const tables = info.tables || {};
            POSTGRES_TABLES.forEach(sec => {
                const el = card.tableEls[sec.key];
                const t = tables[sec.key];
                if (!t) {
                    el.className = 'card-empty';
                    el.textContent = '—';
                } else if (t.error) {
                    el.className = 'card-empty';
                    el.textContent = t.error;
                } else if (!t.columns || !t.columns.length || !t.rows.length) {
                    el.className = 'card-empty';
                    el.textContent = 'Нет данных';
                } else {
                    el.className = '';
                    el.innerHTML = tableHtml(t.columns, t.rows);
                }
            });
        }

        function tableHtml(columns, rows) {
            const head = columns.map(c => `<th>${esc(colLabel(c))}</th>`).join('');
            const body = rows.map(row => {
                const tds = columns.map((c, i) => `<td>${fmtVal(row == null ? null : row[i])}</td>`).join('');
                return `<tr>${tds}</tr>`;
            }).join('');
            return `<div class="table-wrap"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
        }

        /* ---------- WebSocket ---------- */

        function setWsState(on) {
            wsDot.className = 'dot' + (on ? ' on' : '');
            wsText.textContent = on ? 'Подключено' : 'Переподключение...';
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws/stats`);
            ws.onopen = () => setWsState(true);
            ws.onclose = () => { setWsState(false); setTimeout(connect, 3000); };
            ws.onerror = () => ws.close();
            ws.onmessage = (event) => {
                try { render(JSON.parse(event.data)); } catch (e) { /* ignore */ }
            };
        }

        /* ---------- Модалка добавления ---------- */

        const overlay = document.getElementById('overlay');
        const fType = document.getElementById('fType');
        const fPort = document.getElementById('fPort');
        const fUserRow = document.getElementById('fUserRow');
        const fPassRow = document.getElementById('fPassRow');
        const fDbRow = document.getElementById('fDbRow');
        const fUser = document.getElementById('fUser');
        const fPass = document.getElementById('fPass');
        const fDb = document.getElementById('fDb');
        const formError = document.getElementById('formError');

        document.getElementById('addBtn').addEventListener('click', () => openModal());
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

        function openModal() {
            fType.dispatchEvent(new Event('change'));
            formError.style.display = 'none';
            overlay.classList.add('open');
            document.getElementById('fName').focus();
        }
        function closeModal() {
            overlay.classList.remove('open');
        }

        fType.addEventListener('change', () => {
            const meta = TYPE_META[fType.value];
            fPort.value = meta.port;
            fUserRow.style.display = meta.user ? '' : 'none';
            fPassRow.style.display = meta.pass ? '' : 'none';
            fDbRow.style.display = meta.db ? '' : 'none';
            if (meta.db) {
                document.querySelector('#fDbRow label').textContent = meta.dbLabel;
                fDb.placeholder = meta.dbPlaceholder;
                fDb.value = meta.dbValue;
            }
        });

        document.getElementById('connForm').addEventListener('submit', async () => {
            formError.style.display = 'none';
            const meta = TYPE_META[fType.value];
            const payload = {
                name: document.getElementById('fName').value.trim(),
                description: document.getElementById('fDesc').value.trim() || null,
                type: fType.value,
                host: document.getElementById('fHost').value.trim() || 'localhost',
                port: parseInt(fPort.value, 10) || meta.port,
                user: meta.user ? fUser.value.trim() || null : null,
                password: meta.pass ? fPass.value || null : null,
                database: meta.db ? fDb.value.trim() || null : null,
            };
            if (!payload.name) { formError.textContent = 'Укажите название'; formError.style.display = ''; return; }
            try {
                const res = await fetch('/api/v1/connections/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || 'Ошибка создания');
                }
                closeModal();
                document.getElementById('connForm').reset();
            } catch (e) {
                formError.textContent = e.message;
                formError.style.display = '';
            }
        });

        /* ---------- Удаление ---------- */

        async function deleteConnection(id) {
            const name = cards[id] ? cards[id].nameEl.textContent : id;
            if (!confirm(`Удалить подключение «${name}»?`)) return;
            try {
                const res = await fetch('/api/v1/connections/' + encodeURIComponent(id), { method: 'DELETE' });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    alert(err.detail || 'Ошибка удаления');
                    return;
                }
            } catch (e) {
                alert('Не удалось удалить подключение: ' + e.message);
                return;
            }
            deletedIds.add(id);
            if (cards[id]) {
                cards[id].el.remove();
                delete cards[id];
            }
            updateEmptyState();
        }

        /* ---------- Детали ---------- */

        const detailsOverlay = document.getElementById('detailsOverlay');
        const detailsTitle = document.getElementById('detailsTitle');
        const detailsBody = document.getElementById('detailsBody');

        document.getElementById('detailsClose').addEventListener('click', closeDetails);
        detailsOverlay.addEventListener('click', (e) => { if (e.target === detailsOverlay) closeDetails(); });

        function closeDetails() { detailsOverlay.classList.remove('open'); }

        function esc(v) {
            return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            })[ch]);
        }

        function fmtVal(v) {
            if (v == null) return '—';
            if (typeof v === 'object') return esc(JSON.stringify(v));
            return esc(v);
        }

        function renderSection(section) {
            if (section.kind === 'error') {
                return `<div class="details-section error"><h4>${esc(section.title)}</h4><div class="details-error">${esc(section.message)}</div></div>`;
            }
            if (section.kind === 'table') {
                const data = Array.isArray(section.data) ? section.data : [];
                if (!data.length) {
                    return `<div class="details-section"><h4>${esc(section.title)}</h4><div class="details-error">Нет данных</div></div>`;
                }
                const isObjRows = typeof data[0] === 'object';
                let columns = ['value'];
                if (isObjRows) {
                    columns = [];
                    data.forEach(r => Object.keys(r).forEach(k => { if (!columns.includes(k)) columns.push(k); }));
                }
                const rows = data.map(r => columns.map(c => (isObjRows ? r[c] : r)));
                return `<div class="details-section"><h4>${esc(section.title)}</h4>${tableHtml(columns, rows)}</div>`;
            }
            const items = Object.entries(section.data || {});
            if (!items.length) {
                return `<div class="details-section"><h4>${esc(section.title)}</h4><div class="details-error">Нет данных</div></div>`;
            }
            const rows = items.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${fmtVal(v)}</td></tr>`).join('');
            return `<div class="details-section"><h4>${esc(section.title)}</h4><table class="kv-table"><tbody>${rows}</tbody></table></div>`;
        }

        async function openDetails(id) {
            const card = cards[id];
            const name = (card && card.nameEl.textContent) || id;
            detailsTitle.textContent = name;
            detailsBody.innerHTML = '<div class="details-loading"><span class="spinner"></span>Загрузка...</div>';
            detailsOverlay.classList.add('open');
            try {
                const res = await fetch('/api/v1/connections/' + encodeURIComponent(id) + '/details');
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || ('Ошибка: ' + res.status));
                }
                const data = await res.json();
                if (data.status === 'error' && data.message) {
                    detailsBody.innerHTML = `<div class="details-section error"><h4>Ошибка подключения</h4><div class="details-error">${esc(data.message)}</div></div>`;
                    return;
                }
                detailsBody.innerHTML = (data.sections || []).map(renderSection).join('');
            } catch (e) {
                detailsBody.innerHTML = `<div class="details-section error"><h4>Ошибка</h4><div class="details-error">${esc(e.message)}</div></div>`;
            }
        }

        /* ---------- Форматтеры ---------- */

        function fmtUptime(seconds) {
            if (seconds == null) return 'N/A';
            seconds = Number(seconds);
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (d > 0) return `${d}д ${h}ч ${m}м`;
            if (h > 0) return `${h}ч ${m}м`;
            return `${m}м ${seconds % 60}с`;
        }

        connect();
    </script>
</body>
</html>
