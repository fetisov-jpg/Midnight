<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight — Мониторинг баз данных</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f1117;
            color: #e6e6e6;
            min-height: 100vh;
        }
        .container { max-width: 1280px; margin: 0 auto; padding: 24px 20px 40px; }

        header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #262a35; }
        header h1 { font-size: 26px; letter-spacing: 1px; }
        header h1 .moon { color: #7aa2ff; }
        header .subtitle { color: #8b93a7; font-size: 14px; margin-top: 4px; }

        .top-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .status-bar { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #8b93a7; }
        .ws-status { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 20px; background: #1a1e29; border: 1px solid #262a35; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #f44336; }
        .dot.on { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .last-update { font-variant-numeric: tabular-nums; }

        .btn {
            background: #7aa2ff; color: #0f1117; border: none; border-radius: 8px;
            padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background .15s;
        }
        .btn:hover { background: #93b4ff; }
        .btn.secondary { background: #262a35; color: #e6e6e6; }
        .btn.secondary:hover { background: #333a49; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-top: 24px; }

        .card {
            background: #161a24;
            border: 1px solid #262a35;
            border-radius: 12px;
            padding: 18px;
            transition: border-color .2s, transform .15s;
        }
        .card:hover { transform: translateY(-2px); }
        .card.refreshing { border-color: #7aa2ff; }

        .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .card-head .icon { font-size: 20px; }
        .card-head h2 { font-size: 16px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-head .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff9800; flex-shrink: 0; }
        .card-head .status-dot.ok { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .card-head .status-dot.err { background: #f44336; box-shadow: 0 0 8px #f44336; }
        .card-head .status-dot.unknown { background: #ff9800; box-shadow: 0 0 8px #ff9800; }

        .del-btn {
            background: none; border: none; color: #5a6172; cursor: pointer;
            font-size: 15px; padding: 4px 6px; border-radius: 6px; line-height: 1;
        }
        .del-btn:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }

        .card-sub { color: #8b93a7; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

        .metrics { display: flex; flex-direction: column; gap: 8px; }
        .metric { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; padding-bottom: 8px; border-bottom: 1px dashed #232836; }
        .metric:last-child { border-bottom: none; padding-bottom: 0; }
        .metric .label { color: #8b93a7; }
        .metric .value { font-family: 'Consolas', 'Menlo', monospace; color: #e6e6e6; font-weight: 600; }

        .error-msg { color: #ff6b6b; font-size: 12px; margin-top: 10px; word-break: break-word; }

        .empty-state { grid-column: 1 / -1; text-align: center; color: #5a6172; padding: 60px 0; }
        .empty-state button { margin-top: 16px; }

        footer { margin-top: 32px; text-align: center; color: #5a6172; font-size: 12px; }
        footer a { color: #7aa2ff; text-decoration: none; }

        /* Модалка */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.6);
            display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }
        .overlay.open { display: flex; }
        .modal {
            background: #161a24; border: 1px solid #262a35; border-radius: 12px;
            padding: 24px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
        }
        .modal h3 { margin-bottom: 18px; font-size: 18px; }
        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; color: #8b93a7; font-size: 13px; margin-bottom: 6px; }
        .form-row input, .form-row select {
            width: 100%; padding: 9px 12px; border-radius: 8px;
            border: 1px solid #333a49; background: #0f1117; color: #e6e6e6; font-size: 14px;
        }
        .form-row input:focus, .form-row select:focus { outline: none; border-color: #7aa2ff; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .form-error { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1><span class="moon">🌙</span> MIDNIGHT</h1>
                <div class="subtitle">Мониторинг баз данных</div>
            </div>
            <div class="top-actions">
                <span class="ws-status"><span class="dot" id="wsDot"></span><span id="wsText">Подключение...</span></span>
                <span class="last-update">Обновлено: <span id="lastUpdate">—</span></span>
                <button class="btn" id="addBtn">+ Добавить БД</button>
            </div>
        </header>

        <main class="grid" id="grid">
            <div class="empty-state" id="empty">
                Пока нет подключений
                <br><button class="btn" onclick="openModal()">+ Добавить подключение</button>
            </div>
        </main>

        <footer>
            Midnight API &bull; <a href="/docs" target="_blank">Swagger UI</a> &bull; <a href="/redoc" target="_blank">ReDoc</a>
        </footer>
    </div>

    <!-- Модалка добавления подключения -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h3>Новое подключение</h3>
            <form id="connForm" onsubmit="return false;">
                <div class="form-row">
                    <label for="fName">Название</label>
                    <input id="fName" required placeholder="Например: Prod PostgreSQL #2">
                </div>
                <div class="form-row">
                    <label for="fType">Тип БД</label>
                    <select id="fType">
                        <option value="postgres">PostgreSQL</option>
                        <option value="redis">Redis</option>
                        <option value="memcache">Memcached</option>
                        <option value="mongo">MongoDB</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="fHost">Хост</label>
                    <input id="fHost" value="localhost">
                </div>
                <div class="form-grid">
                    <div class="form-row">
                        <label for="fPort">Порт</label>
                        <input id="fPort" type="number" value="5432">
                    </div>
                    <div class="form-row" id="fUserRow">
                        <label for="fUser">Пользователь</label>
                        <input id="fUser" placeholder="postgres">
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-row" id="fPassRow">
                        <label for="fPass">Пароль</label>
                        <input id="fPass" type="password">
                    </div>
                    <div class="form-row" id="fDbRow">
                        <label for="fDb">База данных</label>
                        <input id="fDb">
                    </div>
                </div>
                <div class="form-error" id="formError"></div>
                <div class="modal-actions">
                    <button type="button" class="btn secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn" id="submitBtn">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const TYPE_META = {
            postgres:  { label: 'PostgreSQL', icon: '🐘', port: 5432, user: true,  pass: true,  db: true,  dbLabel: 'База данных', dbPlaceholder: 'postgres', dbValue: 'postgres' },
            redis:     { label: 'Redis',      icon: '🔴', port: 6379, user: false, pass: true,  db: true,  dbLabel: 'БД (номер)',  dbPlaceholder: '0',        dbValue: '0' },
            memcache:  { label: 'Memcached',  icon: '🧠', port: 11211, user: false, pass: false, db: false },
            mongo:     { label: 'MongoDB',    icon: '🍃', port: 27017, user: true,  pass: true,  db: true,  dbLabel: 'База данных', dbPlaceholder: 'admin',   dbValue: 'admin' },
        };

        const METRICS = {
            postgres: [
                { key: 'version', label: 'Версия' },
                { key: 'active_connections', label: 'Активные подключения' },
                { key: 'latency_ms', label: 'Отклик', format: v => v + ' мс' },
            ],
            redis: [
                { key: 'version', label: 'Версия' },
                { key: 'connected_clients', label: 'Клиенты' },
                { key: 'used_memory_human', label: 'Память' },
                { key: 'db_size', label: 'Ключей' },
                { key: 'uptime_seconds', label: 'Аптайм', format: fmtUptime },
                { key: 'latency_ms', label: 'Отклик', format: v => v + ' мс' },
            ],
            memcached: [
                { key: 'uptime', label: 'Аптайм', format: fmtUptime },
                { key: 'curr_items', label: 'Элементов' },
                { key: 'curr_connections', label: 'Соединения' },
                { key: 'get_hits', label: 'Хиты' },
                { key: 'get_misses', label: 'Промахи' },
                { key: 'latency_ms', label: 'Отклик', format: v => v + ' мс' },
            ],
            mongo: [
                { key: 'version', label: 'Версия' },
                { key: 'connections', label: 'Соединения' },
                { key: 'uptime_seconds', label: 'Аптайм', format: fmtUptime },
                { key: 'latency_ms', label: 'Отклик', format: v => v + ' мс' },
            ],
        };

        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');
        const wsDot = document.getElementById('wsDot');
        const wsText = document.getElementById('wsText');
        const lastUpdate = document.getElementById('lastUpdate');
        const cards = {};

        /* ---------- Карточки ---------- */

        function ensureCard(id, type, name) {
            if (cards[id]) return cards[id];
            const meta = TYPE_META[type] || { label: type, icon: '🗄️' };
            const metrics = METRICS[type] || [];
            const card = { el: null, values: {}, dot: null, error: null };
            const el = document.createElement('section');
            el.className = 'card';
            el.innerHTML = `
                <div class="card-head">
                    <span class="status-dot unknown"></span>
                    <span class="icon">${meta.icon}</span>
                    <h2 class="db-name"></h2>
                    <button class="del-btn" title="Удалить подключение">✕</button>
                </div>
                <div class="card-sub">${meta.label}</div>
                <div class="metrics">
                    ${metrics.map(m => `<div class="metric"><span class="label">${m.label}</span><span class="value" data-key="${m.key}">—</span></div>`).join('')}
                </div>
                <div class="error-msg" data-role="error" style="display:none;"></div>
            `;
            card.el = el;
            card.nameEl = el.querySelector('.db-name');
            card.dot = el.querySelector('.status-dot');
            card.error = el.querySelector('[data-role="error"]');
            card.values = {};
            metrics.forEach(m => card.values[m.key] = el.querySelector(`[data-key="${m.key}"]`));
            el.querySelector('.del-btn').addEventListener('click', () => deleteConnection(id));
            grid.appendChild(el);
            cards[id] = card;
            updateEmptyState();
            return card;
        }

        function render(stats) {
            Object.keys(stats).forEach(id => {
                const info = stats[id];
                const type = info.type || 'unknown';
                const card = ensureCard(id, type, info.name || id);
                card.nameEl.textContent = info.name || id;

                const state = info.status === 'connected' ? 'ok' : info.status === 'error' ? 'err' : 'unknown';
                card.dot.className = 'status-dot ' + state;

                if (info.status === 'error' && info.message) {
                    card.error.textContent = info.message;
                    card.error.style.display = '';
                } else {
                    card.error.textContent = '';
                    card.error.style.display = 'none';
                }

                const metrics = info.metrics || {};
                (METRICS[type] || []).forEach(m => {
                    const raw = metrics[m.key];
                    card.values[m.key].textContent = raw == null ? '—' : (m.format ? m.format(raw) : String(raw));
                });

                card.el.classList.add('refreshing');
                clearTimeout(card.el._t);
                card.el._t = setTimeout(() => card.el.classList.remove('refreshing'), 250);
            });

            Object.keys(cards).forEach(id => {
                if (!(id in stats)) { cards[id].el.remove(); delete cards[id]; }
            });

            updateEmptyState();
            lastUpdate.textContent = new Date().toLocaleTimeString('ru-RU');
        }

        function updateEmptyState() {
            empty.style.display = Object.keys(cards).length ? 'none' : '';
        }

        /* ---------- WebSocket ---------- */

        function setWsState(on) {
            wsDot.className = 'dot' + (on ? ' on' : '');
            wsText.textContent = on ? 'Подключено' : 'Переподключение...';
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws/stats`);
            ws.onopen = () => setWsState(true);
            ws.onclose = () => { setWsState(false); setTimeout(connect, 3000); };
            ws.onerror = () => ws.close();
            ws.onmessage = (event) => {
                try { render(JSON.parse(event.data)); } catch (e) { /* ignore */ }
            };
        }

        /* ---------- Модалка добавления ---------- */

        const overlay = document.getElementById('overlay');
        const fType = document.getElementById('fType');
        const fPort = document.getElementById('fPort');
        const fUserRow = document.getElementById('fUserRow');
        const fPassRow = document.getElementById('fPassRow');
        const fDbRow = document.getElementById('fDbRow');
        const fUser = document.getElementById('fUser');
        const fPass = document.getElementById('fPass');
        const fDb = document.getElementById('fDb');
        const formError = document.getElementById('formError');

        document.getElementById('addBtn').addEventListener('click', () => openModal());
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

        function openModal() {
            fType.dispatchEvent(new Event('change'));
            formError.style.display = 'none';
            overlay.classList.add('open');
            document.getElementById('fName').focus();
        }
        function closeModal() {
            overlay.classList.remove('open');
        }

        fType.addEventListener('change', () => {
            const meta = TYPE_META[fType.value];
            fPort.value = meta.port;
            fUserRow.style.display = meta.user ? '' : 'none';
            fPassRow.style.display = meta.pass ? '' : 'none';
            fDbRow.style.display = meta.db ? '' : 'none';
            if (meta.db) {
                document.querySelector('#fDbRow label').textContent = meta.dbLabel;
                fDb.placeholder = meta.dbPlaceholder;
                fDb.value = meta.dbValue;
            }
        });

        document.getElementById('connForm').addEventListener('submit', async () => {
            formError.style.display = 'none';
            const meta = TYPE_META[fType.value];
            const payload = {
                name: document.getElementById('fName').value.trim(),
                type: fType.value,
                host: document.getElementById('fHost').value.trim() || 'localhost',
                port: parseInt(fPort.value, 10) || meta.port,
                user: meta.user ? fUser.value.trim() || null : null,
                password: meta.pass ? fPass.value || null : null,
                database: meta.db ? fDb.value.trim() || null : null,
            };
            if (!payload.name) { formError.textContent = 'Укажите название'; formError.style.display = ''; return; }
            try {
                const res = await fetch('/api/v1/connections/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || 'Ошибка создания');
                }
                closeModal();
                document.getElementById('connForm').reset();
            } catch (e) {
                formError.textContent = e.message;
                formError.style.display = '';
            }
        });

        /* ---------- Удаление ---------- */

        async function deleteConnection(id) {
            const name = cards[id] ? cards[id].nameEl.textContent : id;
            if (!confirm(`Удалить подключение «${name}»?`)) return;
            try {
                await fetch('/api/v1/connections/' + encodeURIComponent(id), { method: 'DELETE' });
            } catch (e) { /* карточка исчезнет при следующем WS-обновлении */ }
        }

        /* ---------- Форматтеры ---------- */

        function fmtUptime(seconds) {
            if (seconds == null) return 'N/A';
            seconds = Number(seconds);
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (d > 0) return `${d}д ${h}ч ${m}м`;
            if (h > 0) return `${h}ч ${m}м`;
            return `${m}м ${seconds % 60}с`;
        }

        connect();
    </script>
</body>
</html>
