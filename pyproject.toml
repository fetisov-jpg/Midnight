[project]
name = "midnight"
version = "0.1.0"
description = "Database statistics collector: PostgreSQL, Redis, Memcached, MongoDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomcache>=0.8.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "motor>=3.7.1",
    "python-dotenv>=1.2.2",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    "websockets>=12.0",
]

[tool.uv.scripts]
start = "uvicorn src.main:app --host 0.0.0.0 --port 8000"
dev = "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
test = "pytest tests/"
format = "black src/ tests/"
lint = "ruff check src/ tests/"
shell = "ipython"

[dependency-groups]
dev = [
    "black>=24.0.0",
    "httpx2>=2.9.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
